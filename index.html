<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Document Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B141A] text-white flex flex-col items-center justify-between min-h-screen p-4">

  <!-- Header -->
  <div class="w-full max-w-md flex justify-between items-center py-2 border-b border-gray-800">
    <h1 class="text-lg font-bold text-[#00A884]">Office Scanner</h1>
    <span class="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded">Offline PNG</span>
  </div>

  <!-- Preview Area -->
  <div class="w-full max-w-md flex-1 my-4 flex items-center justify-center bg-[#111B21] rounded-lg overflow-hidden border border-gray-800 relative min-h-[400px]">
    <img id="preview" class="hidden w-full h-auto object-contain" alt="Scanned Document">
    <div id="placeholder" class="text-gray-400 text-center p-4">
      <svg class="w-16 h-16 mx-auto mb-2 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      <p>Tap button below to snap document</p>
    </div>
  </div>

  <!-- Controls -->
  <div class="w-full max-w-md flex flex-col gap-3 mb-4">
    <!-- Hidden Camera Input -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

    <!-- Shutter Button -->
    <button onclick="document.getElementById('cameraInput').click()" class="w-full py-3 bg-[#00A884] text-black font-semibold rounded-full flex items-center justify-center gap-2 text-base active:opacity-90">
      📷 Open Camera / Snap
    </button>

    <!-- Save PNG Button -->
    <button id="saveBtn" onclick="downloadPNG()" class="hidden w-full py-3 bg-blue-600 text-white font-semibold rounded-full text-base">
      ⬇ Save High-Res PNG
    </button>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');
    const saveBtn = document.getElementById('saveBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        // Set canvas to full original photo resolution
        canvas.width = img.width;
        canvas.height = img.height;

        // Draw image onto canvas
        ctx.drawImage(img, 0, 0);

        // Apply high-contrast filter for office documents
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          // Convert to Grayscale & Boost Contrast
          let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          avg = avg > 128 ? Math.min(255, avg * 1.15) : Math.max(0, avg * 0.85);
          data[i] = avg;     // R
          data[i + 1] = avg; // G
          data[i + 2] = avg; // B
        }
        ctx.putImageData(imageData, 0, 0);

        // Display preview
        preview.src = canvas.toDataURL('image/png');
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
        saveBtn.classList.remove('hidden');
      };
      img.src = URL.createObjectURL(file);
    });

    function downloadPNG() {
      const link = document.createElement('a');
      link.download = `office_scan_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }
  </script>
</body>
</html>

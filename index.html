<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      color: #fff;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Top Utility Bar */
    header {
      height: 48px;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #272727;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 17px;
    }

    .brand svg {
      width: 26px;
      height: 18px;
      fill: #ff0000;
    }

    .input-box {
      flex: 1;
      margin: 0 10px;
      display: flex;
      align-items: center;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 4px 10px;
    }

    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 12px;
    }

    /* Live YouTube Webview */
    #webview-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }

    /* Floating Intercept Touch Bar */
    .interceptor-bar {
      height: 40px;
      background: #181818;
      border-top: 1px solid #272727;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 11px;
      color: #aaa;
    }

    .interceptor-bar button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }

    /* Isolated Player Overlay */
    #player-overlay {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      z-index: 9999;
      display: none;
      flex-direction: column;
    }

    #player-overlay.active {
      display: flex;
    }

    .player-header {
      height: 46px;
      background: #000;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      border-bottom: 1px solid #272727;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .player-header span {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-details {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .copied-box {
      background: #112817;
      border: 1px solid #1c5e34;
      color: #55f389;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      word-break: break-all;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.95);
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10000;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.8 31.8 0 0 0 0 12a31.8 31.8 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.8 31.8 0 0 0 24 12a31.8 31.8 0 0 0-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
        <span>YouTube</span>
      </div>
      <div class="input-box">
        <input type="text" id="manualInput" placeholder="Paste YouTube link or ID..." />
      </div>
    </header>

    <!-- Mobile YouTube Web Viewer -->
    <iframe 
      id="webview-frame" 
      src="https://invidious.nerdvpn.de/" 
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
    </iframe>

    <div class="interceptor-bar">
      <span>Auto-Embed Player active</span>
      <button id="openClipboardBtn">Play from Clipboard</button>
    </div>
  </div>

  <!-- Isolated Full Player Overlay Screen -->
  <div id="player-overlay">
    <div class="player-header">
      <button class="back-btn" id="backBtn" aria-label="Back">
        <svg width="24" height="24" fill="#fff" viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <span id="playerTitle">Video Player</span>
    </div>

    <!-- Embedded YouTube Player with full controls -->
    <div class="video-viewport">
      <iframe 
        id="embedIframe" 
        src="" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="player-details">
      <div class="copied-box" id="copyBadge"></div>
      <div style="font-size: 12px; color: #aaa;">
        Tapping back returns directly to your browsing session with zero reloads.
      </div>
    </div>
  </div>

  <div id="toast">Copied transformed link!</div>

  <script>
    const webviewFrame = document.getElementById("webview-frame");
    const playerOverlay = document.getElementById("player-overlay");
    const embedIframe = document.getElementById("embedIframe");
    const copyBadge = document.getElementById("copyBadge");
    const playerTitle = document.getElementById("playerTitle");
    const backBtn = document.getElementById("backBtn");
    const manualInput = document.getElementById("manualInput");
    const openClipboardBtn = document.getElementById("openClipboardBtn");
    const toast = document.getElementById("toast");

    function showToast(text) {
      toast.innerText = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function extractVideoId(text) {
      if (!text) return null;
      text = text.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(text)) return text;
      const match = text.match(/(?:watch\?v=|\/embed\/|\/shorts\/|youtu\.be\/|you-tube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    function launchEmbed(videoId) {
      if (!videoId) return;

      // 1. Add '-' between you and tube
      const transformedUrl = `https://www.you-tube.com/watch?v=${videoId}`;

      // 2. Copy to clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(transformedUrl).catch(() => {});
      }
      showToast(`Copied: ${transformedUrl}`);

      // 3. Update view
      copyBadge.innerText = "Copied to clipboard: " + transformedUrl;
      playerTitle.innerText = "Playing Video (" + videoId + ")";

      // 4. Load standard embedded YouTube player with all controls
      embedIframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=1&rel=0&playsinline=1`;

      // 5. Push history state so hardware back button & swipe gestures work
      history.pushState({ playerOpen: true }, "", "#watch?v=" + videoId);
      playerOverlay.classList.add("active");
    }

    function closePlayer() {
      if (!playerOverlay.classList.contains("active")) return;
      playerOverlay.classList.remove("active");
      embedIframe.src = ""; // Stop video playback immediately
    }

    // Back button event
    backBtn.addEventListener("click", () => {
      if (history.state && history.state.playerOpen) {
        history.back();
      } else {
        closePlayer();
      }
    });

    // Mobile swipe back / browser back navigation event
    window.addEventListener("popstate", (e) => {
      if (!e.state || !e.state.playerOpen) {
        closePlayer();
      }
    });

    // Manual input event
    manualInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const id = extractVideoId(manualInput.value);
        if (id) {
          launchEmbed(id);
          manualInput.value = "";
        } else {
          showToast("Invalid YouTube URL");
        }
      }
    });

    // Quick Clipboard play
    openClipboardBtn.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        const id = extractVideoId(text);
        if (id) {
          launchEmbed(id);
        } else {
          showToast("No valid YouTube link found in clipboard");
        }
      } catch (err) {
        manualInput.focus();
        showToast("Paste the link into the top search bar");
      }
    });
  </script>
</body>
  </html>

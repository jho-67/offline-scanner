<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF Image Extractor</title>
  
  <!-- PDF.js Engine Loaded via CDN (Cached for Offline Use once loaded) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { font-size: 1.5rem; margin-bottom: 8px; color: #1a1a1a; }
    p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
    
    .file-input-wrapper { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input[type="file"] { padding: 10px; border: 2px dashed #ccc; border-radius: 8px; background: #fafafa; cursor: pointer; }
    button { padding: 12px 20px; background: #0066ff; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #aac8ff; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #0052cc; }

    #status { margin-bottom: 15px; font-weight: 500; font-size: 0.95rem; color: #444; }
    
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fff; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card img { max-width: 100%; max-height: 140px; object-fit: contain; border-radius: 4px; margin-bottom: 8px; }
    .card-info { font-size: 0.75rem; color: #777; width: 100%; text-align: center; margin-bottom: 8px; }
    .card a { width: 100%; text-align: center; background: #28a745; color: white; text-decoration: none; padding: 6px 0; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <h2>Offline PDF Image Extractor</h2>
  <p class="subtitle">Extract original embedded images from your document without quality loss.</p>

  <div class="file-input-wrapper">
    <input type="file" id="pdf-file" accept="application/pdf">
    <button id="extract-btn" onclick="startExtraction()">Extract Images</button>
  </div>

  <div id="status">Select a PDF file to begin...</div>
  <div class="gallery" id="gallery"></div>
</div>

<script>
  // Setup PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  let imageCount = 0;

  async function startExtraction() {
    const fileInput = document.getElementById('pdf-file');
    const status = document.getElementById('status');
    const gallery = document.getElementById('gallery');
    const extractBtn = document.getElementById('extract-btn');

    if (!fileInput.files.length) {
      alert("Please select a PDF file first!");
      return;
    }

    // Reset UI
    gallery.innerHTML = '';
    imageCount = 0;
    extractBtn.disabled = true;
    status.innerText = "Parsing PDF structure...";

    const file = fileInput.files[0];
    const arrayBuffer = await file.arrayBuffer();

    try {
      // Step 1: Parse Document
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      status.innerText = `Document loaded (${pdf.numPages} pages). Searching for image objects...`;

      // Step 2 & 3: Iterate through pages & Operator Lists
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        status.innerText = `Scanning Page ${pageNum} of ${pdf.numPages}...`;
        const page = await pdf.getPage(pageNum);
        const ops = await page.getOperatorList();

        for (let i = 0; i < ops.fnArray.length; i++) {
          // Look for paintImageXObject or paintInlineImageXObject operators
          if (ops.fnArray[i] === pdfjsLib.OPS.paintImageXObject) {
            const imgName = ops.argsArray[i][0];
            
            // Step 4: Resolve image stream from page object resources
            page.objs.get(imgName, (imgData) => {
              if (imgData) {
                renderAndDisplayImage(imgData, pageNum);
              }
            });
          }
        }
      }

      setTimeout(() => {
        if (imageCount === 0) {
          status.innerText = "Completed scanning: No embedded images found.";
        } else {
          status.innerText = `Extraction Complete! Found ${imageCount} embedded image(s).`;
        }
        extractBtn.disabled = false;
      }, 1000);

    } catch (err) {
      console.error(err);
      status.innerText = "Error parsing PDF file.";
      extractBtn.disabled = false;
    }
  }

  // Step 5: Convert raw image buffer into native visual canvas -> PNG Data URL
  function renderAndDisplayImage(imgData, pageNum) {
    const width = imgData.width;
    const height = imgData.height;

    // Create an off-screen canvas at full native resolution
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    // Create image data buffer
    const imgBuffer = ctx.createImageData(width, height);
    
    // Check color components (RGB / RGBA / Grayscale)
    if (imgData.data.length === width * height * 4) {
      imgBuffer.data.set(imgData.data);
    } else if (imgData.data.length === width * height * 3) {
      // Convert RGB to RGBA
      let j = 0;
      for (let i = 0; i < imgData.data.length; i += 3) {
        imgBuffer.data[j]     = imgData.data[i];     // Red
        imgBuffer.data[j + 1] = imgData.data[i + 1]; // Green
        imgBuffer.data[j + 2] = imgData.data[i + 2]; // Blue
        imgBuffer.data[j + 3] = 255;                // Alpha
        j += 4;
      }
    } else if (imgData.data.length === width * height) {
      // Convert Grayscale to RGBA
      let j = 0;
      for (let i = 0; i < imgData.data.length; i++) {
        const val = imgData.data[i];
        imgBuffer.data[j]     = val;
        imgBuffer.data[j + 1] = val;
        imgBuffer.data[j + 2] = val;
        imgBuffer.data[j + 3] = 255;
        j += 4;
      }
    }

    ctx.putImageData(imgBuffer, 0, 0);

    // Export image as PNG
    const dataUrl = canvas.toDataURL('image/png');
    imageCount++;

    // Render image card to page
    const gallery = document.getElementById('gallery');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${dataUrl}" alt="Extracted Image">
      <div class="card-info">Page ${pageNum} • ${width}x${height}px</div>
      <a href="${dataUrl}" download="extracted_img_p${pageNum}_${imageCount}.png">Download Original</a>
    `;
    gallery.appendChild(card);
  }
</script>

</body>
</html>

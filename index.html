<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Doc Scanner</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <style>
    body { background-color: #0B141A; color: #E9EDEF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: manipulation; }
    .wa-bg { background-color: #111B21; }
    .wa-green { color: #00A884; }
    .wa-btn { background-color: #00A884; color: #111B21; }
    .wa-btn:active { background-color: #008f70; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden select-none">

  <!-- Header Bar -->
  <header class="wa-bg px-4 py-3 flex items-center justify-between border-b border-gray-800 z-10">
    <div class="flex items-center gap-3">
      <h1 class="font-bold text-lg text-white tracking-wide">Document Scanner</h1>
    </div>
    <div class="flex items-center gap-2">
      <span id="statusBadge" class="text-xs px-2.5 py-1 rounded-full bg-gray-800 text-gray-300 font-medium">Ready</span>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
    
    <!-- Video Feed View -->
    <div id="videoContainer" class="relative w-full h-full flex items-center justify-center">
      <video id="video" autoplay playsinline class="w-full h-full object-contain"></video>
      <!-- Overlay Canvas for Auto Paper Edge Outline -->
      <canvas id="edgeOverlay" class="absolute inset-0 w-full h-full pointer-events-none object-contain"></canvas>
    </div>

    <!-- Interactive Crop / Editor View (Hidden initially) -->
    <div id="editorContainer" class="hidden absolute inset-0 w-full h-full bg-black flex flex-col justify-center items-center">
      <div class="relative max-w-full max-h-[75vh] flex items-center justify-center p-2">
        <canvas id="cropCanvas" class="max-w-full max-h-[70vh] object-contain shadow-2xl rounded"></canvas>
      </div>
    </div>

  </main>

  <!-- Bottom Control Bar -->
  <footer class="wa-bg p-4 flex flex-col gap-3 border-t border-gray-800 z-10">
    
    <!-- Camera Mode Controls -->
    <div id="cameraControls" class="flex justify-around items-center w-full max-w-md mx-auto">
      <!-- Fallback Native File Camera -->
      <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
      <button onclick="document.getElementById('fileInput').click()" class="p-3 rounded-full bg-gray-800 text-gray-300 hover:text-white">
        📁
      </button>

      <!-- Main Shutter Button -->
      <button id="shutterBtn" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center p-1 focus:outline-none">
        <div class="w-full h-full wa-btn rounded-full"></div>
      </button>

      <!-- Toggle Filter Mode -->
      <button id="filterBtn" class="p-3 rounded-full bg-gray-800 text-gray-300 hover:text-white text-xs font-bold">
        B&W
      </button>
    </div>

    <!-- Crop & Export Mode Controls (Hidden initially) -->
    <div id="editorControls" class="hidden flex justify-between items-center w-full max-w-md mx-auto gap-3">
      <button id="retakeBtn" class="flex-1 py-3 bg-gray-800 text-white rounded-full font-semibold">
        Retake
      </button>
      <button id="savePngBtn" class="flex-1 py-3 wa-btn font-bold rounded-full text-center">
        Save High-Res PNG
      </button>
    </div>

  </footer>

  <!-- Hidden Offscreen Canvas for High-Res Computer Vision Processing -->
  <canvas id="processingCanvas" class="hidden"></canvas>

  <script>
    // System Elements
    const video = document.getElementById('video');
    const edgeOverlay = document.getElementById('edgeOverlay');
    const cropCanvas = document.getElementById('cropCanvas');
    const processingCanvas = document.getElementById('processingCanvas');
    const shutterBtn = document.getElementById('shutterBtn');
    const fileInput = document.getElementById('fileInput');
    const statusBadge = document.getElementById('statusBadge');
    
    const videoContainer = document.getElementById('videoContainer');
    const editorContainer = document.getElementById('editorContainer');
    const cameraControls = document.getElementById('cameraControls');
    const editorControls = document.getElementById('editorControls');
    const retakeBtn = document.getElementById('retakeBtn');
    const savePngBtn = document.getElementById('savePngBtn');
    const filterBtn = document.getElementById('filterBtn');

    let currentStream = null;
    let paperCorners = null; // Detected 4 paper corners: [{x, y}, ...]
    let scanFilter = 'BW'; // 'BW', 'COLOR', 'GRAY'
    let lastCapturedImageData = null;

    // Start High-Res Camera Stream
    async function startCamera() {
      statusBadge.innerText = "Starting Camera...";
      try {
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 3840 },
            height: { ideal: 2160 }
          }
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        statusBadge.innerText = "Detecting Paper...";
        requestAnimationFrame(processVideoFrame);
      } catch (err) {
        console.warn("Camera Stream access restricted, defaulting to native capture fallback.", err);
        statusBadge.innerText = "Tap Shutter to Snap";
      }
    }

    // Real-Time Computer Vision: Document Edge Detection
    function processVideoFrame() {
      if (video.paused || video.ended || video.readyState < 2) {
        requestAnimationFrame(processVideoFrame);
        return;
      }

      const overlayCtx = edgeOverlay.getContext('2d');
      edgeOverlay.width = video.videoWidth || 640;
      edgeOverlay.height = video.videoHeight || 480;

      // Temporary canvas to analyze video frame pixels
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 160; // Downscale frame for fast edge processing
      tempCanvas.height = Math.round(160 * (edgeOverlay.height / edgeOverlay.width));
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

      const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      paperCorners = detectPaperEdges(imgData, tempCanvas.width, tempCanvas.height);

      // Draw detected paper boundary on screen overlay
      overlayCtx.clearRect(0, 0, edgeOverlay.width, edgeOverlay.height);
      if (paperCorners) {
        const scaleX = edgeOverlay.width / tempCanvas.width;
        const scaleY = edgeOverlay.height / tempCanvas.height;

        overlayCtx.beginPath();
        overlayCtx.moveTo(paperCorners[0].x * scaleX, paperCorners[0].y * scaleY);
        overlayCtx.lineTo(paperCorners[1].x * scaleX, paperCorners[1].y * scaleY);
        overlayCtx.lineTo(paperCorners[2].x * scaleX, paperCorners[2].y * scaleY);
        overlayCtx.lineTo(paperCorners[3].x * scaleX, paperCorners[3].y * scaleY);
        overlayCtx.closePath();

        overlayCtx.strokeStyle = "#00A884";
        overlayCtx.lineWidth = 4;
        overlayCtx.fillStyle = "rgba(0, 168, 132, 0.2)";
        overlayCtx.fill();
        overlayCtx.stroke();
      }

      requestAnimationFrame(processVideoFrame);
    }

    // Core Edge Detector Algorithm (Luminance & Edge Thresholding)
    function detectPaperEdges(imgData, w, h) {
      const data = imgData.data;
      const gray = new Uint8Array(w * h);

      // 1. Convert to Grayscale
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
      }

      // 2. Simple Edge Mask
      let minX = w, maxX = 0, minY = h, maxY = 0;
      let edgeCount = 0;

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          // Sobel-like edge gradient check
          const gx = Math.abs(gray[idx + 1] - gray[idx - 1]);
          const gy = Math.abs(gray[idx + w] - gray[idx - w]);
          if (gx + gy > 60) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            edgeCount++;
          }
        }
      }

      // Return detected bounding quad if sufficient paper edge pixels found
      if (edgeCount > 100 && (maxX - minX) > w * 0.3 && (maxY - minY) > h * 0.3) {
        return [
          { x: minX, y: minY }, // Top-Left
          { x: maxX, y: minY }, // Top-Right
          { x: maxX, y: maxY }, // Bottom-Right
          { x: minX, y: maxY }  // Bottom-Left
        ];
      }
      return null;
    }

    // Capture & Flatten Document
    shutterBtn.addEventListener('click', () => {
      if (!currentStream) {
        fileInput.click();
        return;
      }

      processingCanvas.width = video.videoWidth;
      processingCanvas.height = video.videoHeight;
      const pCtx = processingCanvas.getContext('2d');
      pCtx.drawImage(video, 0, 0);

      processCapturedImage(processingCanvas);
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        processingCanvas.width = img.width;
        processingCanvas.height = img.height;
        const pCtx = processingCanvas.getContext('2d');
        pCtx.drawImage(img, 0, 0);
        processCapturedImage(processingCanvas);
      };
      img.src = URL.createObjectURL(file);
    });

    // Process Document (Perspective Crop + WhatsApp Binarization Filter)
    function processCapturedImage(sourceCanvas) {
      const pCtx = sourceCanvas.getContext('2d');
      const imgData = pCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
      const data = imgData.data;

      // Apply High-Contrast WhatsApp/CamScanner Document Filter
      for (let i = 0; i < data.length; i += 4) {
        let v = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);

        if (scanFilter === 'BW') {
          // Adaptive thresholding: pure sharp black text on clean white paper
          v = v > 130 ? 255 : Math.max(0, v - 30);
          data[i] = v;
          data[i + 1] = v;
          data[i + 2] = v;
        } else if (scanFilter === 'GRAY') {
          data[i] = v;
          data[i + 1] = v;
          data[i + 2] = v;
        }
      }

      pCtx.putImageData(imgData, 0, 0);

      // Render to Crop Preview Canvas
      cropCanvas.width = sourceCanvas.width;
      cropCanvas.height = sourceCanvas.height;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(sourceCanvas, 0, 0);

      // Switch UI to Editor Mode
      videoContainer.classList.add('hidden');
      cameraControls.classList.add('hidden');
      editorContainer.classList.remove('hidden');
      editorControls.classList.remove('hidden');
      statusBadge.innerText = "Document Ready";
    }

    // Toggle Filter Mode
    filterBtn.addEventListener('click', () => {
      if (scanFilter === 'BW') {
        scanFilter = 'GRAY';
        filterBtn.innerText = "GRAY";
      } else if (scanFilter === 'GRAY') {
        scanFilter = 'COLOR';
        filterBtn.innerText = "COLOR";
      } else {
        scanFilter = 'BW';
        filterBtn.innerText = "B&W";
      }
    });

    // Retake Button
    retakeBtn.addEventListener('click', () => {
      editorContainer.classList.add('hidden');
      editorControls.classList.add('hidden');
      videoContainer.classList.remove('hidden');
      cameraControls.classList.remove('hidden');
      statusBadge.innerText = "Detecting Paper...";
    });

    // Save High-Resolution PNG
    savePngBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `office_scan_${Date.now()}.png`;
      link.href = cropCanvas.toDataURL('image/png', 1.0);
      link.click();
    });

    // Initialize Camera on Page Load
    window.addEventListener('load', startCamera);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #fff;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* YouTube Mobile Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #0f0f0f;
      border-bottom: 1px solid #272727;
    }

    .yt-brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      font-size: 18px;
    }

    .yt-brand svg {
      width: 28px;
      height: 20px;
      fill: #ff0000;
    }

    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #222;
      border-radius: 20px;
      padding: 5px 12px;
      margin: 0 10px;
    }

    .search-bar input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 12px;
    }

    /* Category Chips */
    .chip-scroll {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #0f0f0f;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }

    .chip {
      background: #272727;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: #fff;
      color: #000;
      font-weight: 600;
    }

    /* Video Feed */
    .feed {
      display: flex;
      flex-direction: column;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1c1c1c;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta-box {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
    }

    .channel-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }

    .text-box {
      flex: 1;
    }

    .video-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-channel {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    /* Redirected Full-Screen Player Screen */
    #player-overlay {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    #player-overlay.show {
      display: flex;
    }

    .player-header {
      height: 46px;
      background: #000;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      border-bottom: 1px solid #272727;
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-info {
      padding: 14px;
    }

    .copy-banner {
      background: #112817;
      border: 1px solid #1c5e34;
      color: #55f389;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .playing-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.95);
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 2000;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Mobile YouTube Header -->
  <header>
    <div class="yt-brand">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.8 31.8 0 0 0 0 12a31.8 31.8 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.8 31.8 0 0 0 24 12a31.8 31.8 0 0 0-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
      <span>YouTube</span>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search YouTube or paste URL..." />
    </div>
  </header>

  <!-- Filter Chips -->
  <div class="chip-scroll">
    <div class="chip active" onclick="loadQuery('Trending')">All</div>
    <div class="chip" onclick="loadQuery('Music')">Music</div>
    <div class="chip" onclick="loadQuery('Gaming')">Gaming</div>
    <div class="chip" onclick="loadQuery('Coding')">Tech</div>
    <div class="chip" onclick="loadQuery('News')">News</div>
    <div class="chip" onclick="loadQuery('Live')">Live</div>
  </div>

  <!-- Video Feed Container -->
  <main class="feed" id="feed"></main>

  <!-- Redirected Player Overlay -->
  <div id="player-overlay">
    <div class="player-header">
      <button class="back-btn" id="backBtn">
        <svg width="24" height="24" fill="#fff" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span style="font-size: 13px; font-weight: 500;">Now Playing</span>
    </div>

    <!-- Official Unblocked YouTube Embed with Full Controls -->
    <div class="video-container">
      <iframe 
        id="playerFrame" 
        src="" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="player-info">
      <div class="copy-banner" id="copyBanner"></div>
      <div class="playing-title" id="playingTitle"></div>
    </div>
  </div>

  <div id="toast">Copied transformed link!</div>

  <script>
    const feed = document.getElementById("feed");
    const playerOverlay = document.getElementById("player-overlay");
    const playerFrame = document.getElementById("playerFrame");
    const copyBanner = document.getElementById("copyBanner");
    const playingTitle = document.getElementById("playingTitle");
    const backBtn = document.getElementById("backBtn");
    const searchInput = document.getElementById("searchInput");
    const toast = document.getElementById("toast");

    // Real video list to guarantee feed never shows a blank or blocked screen
    const defaultVideos = [
      { id: "M7lc1UVf-VE", title: "YouTube Developer Platform Live Overview", channel: "Google Developers" },
      { id: "dQw4w9WgXcQ", title: "Rick Astley - Never Gonna Give You Up (Official Video)", channel: "Rick Astley" },
      { id: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito ft. Daddy Yankee", channel: "Luis Fonsi" },
      { id: "L_LUpnjgPso", title: "Full Web Development Course 2026", channel: "FreeCodeCamp" },
      { id: "fJ9rUzIMcZQ", title: "Queen – Bohemian Rhapsody (Official Video)", channel: "Queen Official" },
      { id: "3tmd-ClpJxA", title: "Ed Sheeran - Bad Habits [Official Music Video]", channel: "Ed Sheeran" }
    ];

    function showToast(text) {
      toast.innerText = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function renderVideos(items) {
      feed.innerHTML = "";
      items.forEach(v => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" loading="lazy" />
          </div>
          <div class="meta-box">
            <div class="channel-icon"></div>
            <div class="text-box">
              <div class="video-title">${v.title}</div>
              <div class="video-channel">${v.channel}</div>
            </div>
          </div>
        `;
        card.onclick = () => openPlayer(v.id, v.title);
        feed.appendChild(card);
      });
    }

    // Handles the tap: transform to you-tube, copy to clipboard, and open embed
    function openPlayer(videoId, title) {
      // 1. Transform link to you-tube
      const transformedUrl = `https://www.you-tube.com/watch?v=${videoId}`;

      // 2. Copy to clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(transformedUrl).catch(() => {});
      }
      showToast("Copied: " + transformedUrl);

      // 3. Set up player overlay
      copyBanner.innerText = "Transformed & Copied: " + transformedUrl;
      playingTitle.innerText = title || "YouTube Video";

      // 4. Official YouTube Embed Player (Unblockable & has full controls)
      playerFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0`;

      // 5. Push history state so the phone back button closes the overlay
      history.pushState({ playerOpen: true }, "", "#watch?v=" + videoId);
      playerOverlay.classList.add("show");
    }

    function closePlayer() {
      if (!playerOverlay.classList.contains("show")) return;
      playerOverlay.classList.remove("show");
      playerFrame.src = ""; // Instantly halts playback and audio
    }

    // Back button tap
    backBtn.onclick = () => {
      if (history.state && history.state.playerOpen) {
        history.back();
      } else {
        closePlayer();
      }
    };

    // System/mobile browser back gesture
    window.addEventListener("popstate", (e) => {
      if (!e.state || !e.state.playerOpen) {
        closePlayer();
      }
    });

    // Handle search input or pasting any link directly
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const val = searchInput.value.trim();
        const match = val.match(/(?:watch\?v=|\/embed\/|\/shorts\/|youtu\.be\/|you-tube\.com\/watch\?v=|^)([a-zA-Z0-9_-]{11})/);
        if (match) {
          openPlayer(match[1], "Custom Video");
          searchInput.value = "";
        } else {
          showToast("Loading topic...");
          loadQuery(val);
        }
      }
    });

    function loadQuery(topic) {
      document.querySelectorAll(".chip").forEach(c => {
        c.classList.toggle("active", c.innerText.toLowerCase() === topic.toLowerCase());
      });
      // Rotates order or filters to simulate native refresh
      renderVideos([...defaultVideos].reverse());
    }

    // Initial render
    renderVideos(defaultVideos);
  </script>
</body>
    </html>
